<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset Password</title>
<link rel="stylesheet" href="styles/Next_Revision.vars.css">
<link rel="stylesheet" href="styles/styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="site-header__bar content-width">
        <button class="icon-button" type="button" aria-label="Security information">
          <img src="images/icon-lock.svg" alt="" width="24" height="24">
        </button>
        <a class="site-header__logo" href="/" aria-label="Next home">
          <img src="images/new-next-logo.svg" alt="Next" width="83" height="20">
        </a>
        <div class="site-header__actions">
          <a class="site-header__help" href="/">Help</a>
          <span class="site-header__divider" aria-hidden="true"></span>
          <a class="icon-button icon-button--bag" href="/" aria-label="Bag, 1 item">
            <img src="images/icon-bag.svg" alt="" width="24" height="24">
            <span class="badge-count">1</span>
          </a>
        </div>
      </div>
      <nav class="page-nav content-width" aria-label="Page">
        <h1 class="page-nav__title">Reset Password</h1>
      </nav>
    </header>

    <main class="content-width page-content">
      <section class="alert-banner" aria-labelledby="alert-title">
        <h2 id="alert-title" class="alert-banner__title">Please set a new password</h2>
        <p class="alert-banner__copy">
          You will need to use your new details next time you sign in or place an order.
        </p>
      </section>

      <form class="password-form" action="/" method="post" novalidate>
        <div class="field-group">
          <label class="field-group__label" for="new-password">New Password</label>
          <div class="password-input">
            <input
              id="new-password"
              class="password-input__control"
              name="new-password"
              type="text"
              value=""
              autocomplete="new-password"
            >
            <button class="password-input__toggle" type="button" aria-controls="new-password" aria-label="Hide password">
              Hide
            </button>
          </div>
        </div>

        <section class="password-rules" aria-labelledby="password-rules-title">
          <h2 id="password-rules-title" class="password-rules__title">Your password must contain:</h2>
          <ul class="password-rules__list">
            <li class="password-rules__item" data-rule="lowercase">
              <img class="password-rules__icon" src="images/icon-bullet-neutral.svg" alt="" width="24" height="24">
              <span>One lowercase letter</span>
            </li>
            <li class="password-rules__item" data-rule="number">
              <img class="password-rules__icon" src="images/icon-bullet-neutral.svg" alt="" width="24" height="24">
              <span>One number</span>
            </li>
            <li class="password-rules__item" data-rule="uppercase">
              <img class="password-rules__icon" src="images/icon-bullet-neutral.svg" alt="" width="24" height="24">
              <span>One UPPERCASE letter</span>
            </li>
            <li class="password-rules__item" data-rule="length">
              <img class="password-rules__icon" src="images/icon-bullet-neutral.svg" alt="" width="24" height="24">
              <span>8 to 25 characters</span>
            </li>
          </ul>
        </section>

        <button class="primary-action" type="submit">Set New Password</button>
      </form>
    </main>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="scripts/script.js"></script>
</body>
</html>
